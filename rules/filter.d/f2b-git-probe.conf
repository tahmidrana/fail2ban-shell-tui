# Fail2Ban filter: requests for exposed version-control metadata.
# Matches regardless of status code - asking at all is the signal.

[INCLUDES]
before = common.conf

[Definition]
failregex = ^<HOST> -[^"]*"(?:GET|POST|HEAD) [^"]*/\.(?:git|svn|hg|bzr)(?:/|%%2[fF])[^"]* HTTP/[0-9.]+" 
ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
