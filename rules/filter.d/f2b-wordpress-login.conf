# Fail2Ban filter: failed WordPress logins seen in a combined-format access log.
# A failed POST to wp-login.php re-renders the form (HTTP 200); success is 302.

[INCLUDES]
before = common.conf

[Definition]
failregex = ^<HOST> -[^"]*"POST [^"]*/wp-login\.php(?:\?[^" ]*)? HTTP/[0-9.]+" 200 
ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
