# Fail2Ban filter: failed logins written to Laravel's log by an
# Illuminate\Auth\Events\Failed listener (see rules/README.md).
#
# Expected line:
#   [2026-09-13 10:15:22] production.WARNING: Failed login for bob@example.com from 203.0.113.9
# The user part is free text; only the trailing "from <ip>" matters.

[Definition]
failregex = ^\[\]\s+\S+\.(?:WARNING|NOTICE|INFO): Failed login(?: for \S+)? from <HOST>\s*$
ignoreregex =

# Laravel: "[2026-09-13 10:15:22] env.LEVEL: message"
datepattern = ^\[({DATE})\]
