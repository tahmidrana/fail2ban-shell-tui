# Fail2Ban filter: requests for secrets, debug output, backups and webshells.
# Matches regardless of status code - asking at all is the signal.
#
# Paths covered:
#   .env  .env.*  .env-*  (.env.local, .env.production, .env.bak ...)
#   .aws/credentials  .ssh/  .htpasswd  .DS_Store  .idea/  .vscode/
#   wp-config.php / config.php / settings.php followed by .bak .old .save .swp ~ .orig .txt .zip .tar.gz
#   phpinfo.php  info.php  test.php  _profiler/phpinfo  (Symfony/Laravel debug)
#   composer.json/lock  package.json  yarn.lock  Dockerfile  docker-compose.yml
#   common uploaded-shell names: shell.php c99.php r57.php wso.php alfa.php
#   backup archives at the web root: backup.zip site.tar.gz db.sql dump.sql

[INCLUDES]
before = common.conf

[Definition]
_req  = (?:GET|POST|HEAD)
_tail = (?:\?[^" ]*)? HTTP/[0-9.]+" 

failregex = ^<HOST> -[^"]*"%(_req)s [^"]*/\.env(?:[.\-][^" /]*)?%(_tail)s
            ^<HOST> -[^"]*"%(_req)s [^"]*/\.(?:aws/credentials|ssh/[^" ]*|htpasswd|DS_Store|idea/[^" ]*|vscode/[^" ]*)%(_tail)s
            ^<HOST> -[^"]*"%(_req)s [^"]*/(?:wp-config|config|settings|configuration|database|db)\.php(?:\.(?:bak|old|save|swp|orig|txt|zip|gz|tar\.gz|dist|~)|~)%(_tail)s
            ^<HOST> -[^"]*"%(_req)s [^"]*/(?:phpinfo|info|test|i|pi)\.php%(_tail)s
            ^<HOST> -[^"]*"%(_req)s [^"]*/_profiler/(?:phpinfo|open)[^" ]*%(_tail)s
            ^<HOST> -[^"]*"%(_req)s [^"]*/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|Dockerfile|docker-compose\.ya?ml)%(_tail)s
            ^<HOST> -[^"]*"%(_req)s [^"]*/(?:shell|c99|c100|r57|wso|alfa|b374k|mini|up|upload|cmd|xleet|xl|adminer)\.php%(_tail)s
            ^<HOST> -[^"]*"%(_req)s [^"]*/(?:backup|site|www|html|public_html|dump|db|database)\.(?:zip|rar|7z|tar|tar\.gz|tgz|sql|sql\.gz)%(_tail)s
ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
