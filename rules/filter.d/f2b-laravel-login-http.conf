# Fail2Ban filter: Laravel login attempts rejected at HTTP level, from the
# web server access log. 422 = validation failed (JSON/Inertia/Fortify),
# 401 = API guard, 429 = the app's own throttle kicked in.

[INCLUDES]
before = common.conf

[Definition]
failregex = ^<HOST> -[^"]*"POST [^"]*/(?:login|api/login|api/auth/login|sanctum/token)(?:\?[^" ]*)? HTTP/[0-9.]+" (?:401|422|429) 
ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
