# f2b-cloudflare.conf - block an IP at Cloudflare's edge via an IP Access Rule.
# Needed on servers behind Cloudflare, where a firewall ban cannot stop
# proxied web traffic (the packets come from Cloudflare, not the attacker).
# Requires curl and jq.
#
# Token: Cloudflare dashboard > My Profile > API Tokens > Create Token, with
# only "Zone > Firewall Services > Edit" on the one zone. Never use the global key.
# Keep the jail file that holds the token at mode 600.
#
# Note: Cloudflare Access Rules do not expire. Unbans are sent when fail2ban
# lifts a ban, so a fail2ban restart that drops state can leave stale rules.

[Definition]
actionstart =
actionstop =
actioncheck =

actionban = curl -fsS -o /dev/null -X POST \
            -H "Authorization: Bearer <cftoken>" -H "Content-Type: application/json" \
            --data '{"mode":"block","configuration":{"target":"ip","value":"<ip>"},"notes":"fail2ban <name>"}' \
            "https://api.cloudflare.com/client/v4/zones/<cfzone>/firewall/access_rules/rules"

actionunban = id=$(curl -fsS -H "Authorization: Bearer <cftoken>" \
              "https://api.cloudflare.com/client/v4/zones/<cfzone>/firewall/access_rules/rules?configuration.target=ip&configuration.value=<ip>&match=all&per_page=1" \
              | jq -r '.result[0].id // empty')
              [ -n "$id" ] && curl -fsS -o /dev/null -X DELETE -H "Authorization: Bearer <cftoken>" \
              "https://api.cloudflare.com/client/v4/zones/<cfzone>/firewall/access_rules/rules/$id" || true

[Init]
cftoken =
cfzone =
